# Bağımlılık güncellemeleri: haftada bir kontrol edilir, yeni sürümler (güvenlik yamaları dahil)
# PR olarak gelir; CI o PR'da testleri çalıştırır. Küçük güncellemeler tek PR'da toplanır.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule: { interval: weekly }
    groups:
      minor-and-patch: { update-types: [minor, patch] }
    ignore:
      # Spring Boot'un OpenTelemetry API sürümüne bağlı (pom.xml'deki nota bakın); elle yükseltilir.
      - dependency-name: io.opentelemetry.instrumentation:opentelemetry-logback-appender-1.0

  # TypeScript'in büyük sürümleri (7+) typescript-eslint desteklemeden kurulamıyor; elle yükseltilir.
  - package-ecosystem: npm
    directory: /admin-panel
    schedule: { interval: weekly }
    groups:
      minor-and-patch: { update-types: [minor, patch] }
    ignore:
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /services/iyzico-service
    schedule: { interval: weekly }
    groups:
      minor-and-patch: { update-types: [minor, patch] }
    ignore:
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  # cargo-service: Directory.Packages.props (merkezi sürümler) + packages.lock.json.
  - package-ecosystem: nuget
    directory: /services/cargo-service
    schedule: { interval: weekly }
    groups:
      minor-and-patch: { update-types: [minor, patch] }

  - package-ecosystem: docker
    directories: [/, /admin-panel, /services/iyzico-service, /services/cargo-service]
    schedule: { interval: weekly }

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
