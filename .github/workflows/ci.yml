# Her push ve PR'da dört parçanın testleri ayrı ayrı (paralel) çalışır. Hiçbiri gerçek iyzico'ya,
# geliştirme veritabanına ya da sırlara (secrets) ihtiyaç duymaz: veritabanı ve RabbitMQ testlerin
# kendi açtığı geçici konteynerlerdir (Testcontainers), arayüz testleri sahte backend'le çalışır.
name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Testler (geçici PostgreSQL + RabbitMQ)
        run: chmod +x mvnw && ./mvnw -B test
      - name: Test raporları
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-surefire-reports
          path: target/surefire-reports
          retention-days: 7

  iyzico-service:
    name: iyzico-service (NestJS)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/iyzico-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: services/iyzico-service/package-lock.json
      - run: npm ci
      - name: Prisma istemcisi
        run: npx prisma generate
      - name: Tür denetimi
        run: npm run typecheck
      - name: Testler (geçici PostgreSQL + RabbitMQ)
        run: npm test

  cargo-service:
    name: cargo-service (.NET)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/cargo-service
    env:
      DOTNET_NOLOGO: "true"
      DOTNET_CLI_TELEMETRY_OPTOUT: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: services/cargo-service/global.json
          cache: true
          cache-dependency-path: services/cargo-service/**/packages.lock.json
      # packages.lock.json dışında bir sürüm çözülürse durur. NuGetAudit bilinen açıklı paketi
      # uyarı olarak verir; TreatWarningsAsErrors (Directory.Build.props) bunu hataya çevirir.
      - name: Bağımlılıklar (kilitli kip)
        run: dotnet restore --locked-mode
      - name: Bağımlılık taraması (bilinen açıklar, dolaylılar dahil)
        run: |
          # JSON çıktısı dilden bağımsızdır; açıklı paket varsa "vulnerabilities" alanı yazılır.
          dotnet list package --vulnerable --include-transitive --no-restore --format json > vulnerable.json
          cat vulnerable.json
          if grep -q '"vulnerabilities"' vulnerable.json; then
            echo "::error::Açıklı NuGet paketi var (yukarıdaki listeye bakın)"; exit 1
          fi
      - name: Derleme
        run: dotnet build -c Release --no-restore
      - name: Testler (geçici PostgreSQL + RabbitMQ)
        run: dotnet test -c Release --no-build
      - name: Docker imajı (compose'daki cargo-service ile aynı Dockerfile)
        run: docker build -t e-ticaret-cargo:ci .

  frontend:
    name: Arayüz (React)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: admin-panel
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: admin-panel/package-lock.json
      - run: npm ci
      - name: Bağımlılık taraması (çalışma zamanı paketleri, high ve üstü)
        run: npm audit --omit=dev --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Tür denetimi
        run: npm run typecheck
      - name: Birim testleri
        run: node --test src/favorites.test.mjs
      - name: Derleme
        run: npm run build
      - name: Playwright tarayıcısı
        run: npx playwright install --with-deps chromium
      - name: Arayüz testleri (Playwright, sahte backend)
        run: npm run test:e2e
      - name: Docker imajı (nginx, compose'daki frontend servisiyle aynı Dockerfile)
        run: docker build -t e-ticaret-frontend:ci .
      - name: Playwright raporu
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            admin-panel/playwright-report
            admin-panel/test-results
          retention-days: 7
