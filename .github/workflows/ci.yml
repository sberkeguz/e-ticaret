# Her push ve PR'da üç parçanın testleri ayrı ayrı (paralel) çalışır. Hiçbiri gerçek iyzico'ya,
# geliştirme veritabanına ya da sırlara (secrets) ihtiyaç duymaz: veritabanı ve RabbitMQ testlerin
# kendi açtığı geçici konteynerlerdir (Testcontainers), arayüz testleri sahte backend'le çalışır.
name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Spring Boot)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Testler (geçici PostgreSQL + RabbitMQ)
        run: chmod +x mvnw && ./mvnw -B test
      - name: Test raporları
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-surefire-reports
          path: target/surefire-reports
          retention-days: 7

  iyzico-service:
    name: iyzico-service (NestJS)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: services/iyzico-service
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: services/iyzico-service/package-lock.json
      - run: npm ci
      - name: Prisma istemcisi
        run: npx prisma generate
      - name: Tür denetimi
        run: npm run typecheck
      - name: Testler (geçici PostgreSQL + RabbitMQ)
        run: npm test

  frontend:
    name: Arayüz (React)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: admin-panel
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: admin-panel/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Tür denetimi
        run: npm run typecheck
      - name: Birim testleri
        run: node --test src/favorites.test.mjs
      - name: Derleme
        run: npm run build
      - name: Playwright tarayıcısı
        run: npx playwright install --with-deps chromium
      - name: Arayüz testleri (Playwright, sahte backend)
        run: npm run test:e2e
      - name: Playwright raporu
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            admin-panel/playwright-report
            admin-panel/test-results
          retention-days: 7
