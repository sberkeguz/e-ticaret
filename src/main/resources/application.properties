spring.application.name=e-ticaret
spring.datasource.url=jdbc:postgresql://localhost:5432/eticaret
spring.datasource.username=eticaret_user
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.flyway.out-of-order=true
jwt.secret=${JWT_SECRET}
# iyzico ile yalnızca IyzicoService konuşur; backend ona bu adresten ulaşır.
iyzico-service.url=${IYZICO_SERVICE_URL:http://localhost:8081}
iyzico-service.token=${INTERNAL_API_TOKEN:}
# RabbitMQ: IyzicoService'in ödeme olaylarını dinler.
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USER:eticaret}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:eticaret_dev_rabbit}
# Tekrar deneme/DLQ kuyruğuna gönderirken RabbitMQ'nun "aldım" onayını bekleriz.
spring.rabbitmq.publisher-confirm-type=simple
# Onay (ack) dinleyici başarıyla dönünce, yani veritabanı işlemi bittikten sonra gider.
spring.rabbitmq.listener.simple.acknowledge-mode=auto
# Dinleyici yine de hata fırlatırsa mesaj tekrar kuyruğa dönmez; kuyruğun DLQ ayarıyla DLQ'ya gider.
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.concurrency=1
spring.rabbitmq.listener.simple.max-concurrency=4
spring.rabbitmq.listener.simple.prefetch=10
app.frontend-url=${APP_FRONTEND_URL:http://localhost:3000}
payment.reservation-cleanup-delay-ms=30000
