spring.application.name=e-ticaret
spring.datasource.url=jdbc:postgresql://localhost:5432/eticaret
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:eticaret_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# Şema yalnızca Flyway ile değişir; Hibernate açılışta kodun şemayla uyuştuğunu kontrol eder.
spring.jpa.hibernate.ddl-auto=validate
# Veritabanı bağlantısı yalnızca işlem (transaction) sürerken tutulur; istek boyunca değil.
# Açık olsaydı bekletmeli istekler (ödeme sonucu) bekleme süresince bağlantı tutardı.
spring.jpa.open-in-view=false
# İlişkili kayıtlar (sipariş ürünleri, kullanıcı) tek tek değil 50'şerlik gruplar hâlinde yüklenir.
spring.jpa.properties.hibernate.default_batch_fetch_size=50
# Zamanlar her zaman UTC olarak okunup yazılır (sunucunun saat dilimine bakılmaz).
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.out-of-order=true
jwt.secret=${JWT_SECRET}
# iyzico ile yalnızca IyzicoService konuşur; backend ona bu adresten ulaşır.
iyzico-service.url=${IYZICO_SERVICE_URL:http://localhost:8081}
iyzico-service.token=${INTERNAL_API_TOKEN:}
# RabbitMQ: IyzicoService'in ödeme olaylarını dinler.
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=${RABBITMQ_USER:eticaret}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:eticaret_dev_rabbit}
# Tekrar deneme/DLQ kuyruğuna gönderirken RabbitMQ'nun "aldım" onayını bekleriz.
spring.rabbitmq.publisher-confirm-type=simple
# Onay (ack) dinleyici başarıyla dönünce, yani veritabanı işlemi bittikten sonra gider.
spring.rabbitmq.listener.simple.acknowledge-mode=auto
# Dinleyici yine de hata fırlatırsa mesaj tekrar kuyruğa dönmez; kuyruğun DLQ ayarıyla DLQ'ya gider.
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.concurrency=1
spring.rabbitmq.listener.simple.max-concurrency=4
spring.rabbitmq.listener.simple.prefetch=10
app.frontend-url=${APP_FRONTEND_URL:http://localhost:3000}
payment.reservation-cleanup-delay-ms=30000
# Backend nginx'in arkasında: gerçek müşteri IP'si X-Forwarded-For'dan okunur (iyzico dolandırıcılık
# kontrolü için gerekli). Tomcat bu başlığa yalnızca iç ağdaki (özel IP'li) vekillerden geldiğinde güvenir.
server.forward-headers-strategy=native

# İzleme (OpenTelemetry). Her istek bir iz (trace) açar; iyzico-service çağrısı ve RabbitMQ mesajı aynı
# ize bağlanır (traceparent başlığı). Adres boşsa iz gönderilmez (testler, Docker'sız çalıştırma).
management.tracing.sampling.probability=1.0
management.opentelemetry.tracing.export.otlp.endpoint=${OTEL_TRACES_ENDPOINT:}
management.tracing.export.otlp.enabled=${OTEL_ENABLED:false}
# Ölçümler (istek süreleri vb.) Grafana'daki Prometheus'a OTLP ile gider.
management.otlp.metrics.export.enabled=${OTEL_ENABLED:false}
management.otlp.metrics.export.url=${OTEL_METRICS_ENDPOINT:http://localhost:4318/v1/metrics}
management.otlp.metrics.export.step=15s
# Loglar da Grafana'ya (Loki) gider (logback-spring.xml'deki OTEL ekleyicisi).
management.logging.export.otlp.enabled=${OTEL_ENABLED:false}
management.opentelemetry.logging.export.otlp.endpoint=${OTEL_LOGS_ENDPOINT:}
management.opentelemetry.resource-attributes.deployment.environment=${DEPLOY_ENV:local}
spring.rabbitmq.listener.simple.observation-enabled=true
spring.rabbitmq.template.observation-enabled=true
# Süre dağılımı (histogram) da gönderilir; Grafana'da p50/p95 bunlardan hesaplanır.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles-histogram.http.client.requests=true
