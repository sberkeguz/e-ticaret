spring.application.name=e-ticaret
spring.datasource.url=jdbc:postgresql://localhost:5432/eticaret
spring.datasource.username=eticaret_user
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.flyway.out-of-order=true
jwt.secret=${JWT_SECRET}
iyzico.api-key=${IYZIPAY_API_KEY:}
iyzico.secret-key=${IYZIPAY_SECRET_KEY:}
iyzico.base-url=${IYZIPAY_BASE_URL:https://sandbox-api.iyzipay.com}
iyzico.callback-url=${IYZIPAY_CALLBACK_URL:http://localhost:8080/api/payments/callback}
app.frontend-url=${APP_FRONTEND_URL:http://localhost:3000}