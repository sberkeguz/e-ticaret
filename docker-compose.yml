  services:
    postgres:
      image: postgres:17-alpine
      environment:
        POSTGRES_DB: eticaret
        POSTGRES_USER: eticaret_user
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eticaret_dev_password}
        # Servis kullanıcılarının şifreleri (yalnızca ilk kurulumda kullanılır)
        BACKEND_DB_PASSWORD: ${BACKEND_DB_PASSWORD:-backend_dev_password}
        IYZICO_DB_PASSWORD: ${IYZICO_DB_PASSWORD:-iyzico_dev_password}
      ports:
        - "5432:5432"
      volumes:
        - postgres_data:/var/lib/postgresql/data
        # Boş veritabanı ilk açıldığında servis kullanıcılarını kurar (backend_app, iyzico_app)
        - ./docker/postgres/init/10-service-roles.sh:/docker-entrypoint-initdb.d/10-service-roles.sh:ro
        - ./docker/postgres/service-roles.sql:/docker-entrypoint-initdb.d/service-roles.sql.txt:ro
      healthcheck:
        test: [ "CMD-SHELL", "pg_isready -U eticaret_user -d eticaret" ]
        interval: 5s
        timeout: 5s
        retries: 10

    # Veritabanı yönetim paneli: http://localhost:5050 (yalnızca bu bilgisayardan)
    pgadmin:
      image: dpage/pgadmin4:9
      environment:
        PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
        PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin_dev_password}
        PGADMIN_CONFIG_SERVER_MODE: "True"
      ports:
        - "127.0.0.1:5050:80"
      volumes:
        - pgadmin_data:/var/lib/pgadmin
        # Açılışta e-ticaret veritabanı bağlantısı hazır gelir (şifreyi ilk bağlanışta sorar).
        - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
      depends_on:
        postgres:
          condition: service_healthy

    # Servisler arası mesajlaşma. Yönetim arayüzü: http://localhost:15672 (DLQ'lar burada görünür)
    rabbitmq:
      image: rabbitmq:4-management-alpine
      environment:
        RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-eticaret}
        RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-eticaret_dev_rabbit}
      ports:
        - "127.0.0.1:5672:5672"
        - "127.0.0.1:15672:15672"
      volumes:
        - rabbitmq_data:/var/lib/rabbitmq
      healthcheck:
        test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
        interval: 5s
        timeout: 10s
        retries: 20

    # iyzico ile konuşan tek servis (NestJS + Prisma). Aynı Postgres, kendi şeması (iyzico).
    iyzico-service:
      build:
        context: ./services/iyzico-service
        dockerfile: Dockerfile
      environment:
        # Yalnızca iyzico şemasına yetkili kullanıcı
        DATABASE_URL: postgresql://iyzico_app:${IYZICO_DB_PASSWORD:-iyzico_dev_password}@postgres:5432/eticaret?schema=iyzico
        RABBITMQ_URL: amqp://${RABBITMQ_USER:-eticaret}:${RABBITMQ_PASSWORD:-eticaret_dev_rabbit}@rabbitmq:5672
        INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN .env dosyasinda tanimli olmali}
        IYZIPAY_API_KEY: ${IYZIPAY_API_KEY:-}
        IYZIPAY_SECRET_KEY: ${IYZIPAY_SECRET_KEY:-}
        IYZIPAY_BASE_URL: ${IYZIPAY_BASE_URL:-https://sandbox-api.iyzipay.com}
        # 3D dönüşü tarayıcıdan backend'e gelir (ngrok), backend bu servise iletir.
        IYZIPAY_CALLBACK_URL: ${IYZIPAY_CALLBACK_URL:-http://localhost:8080/api/payments/callback}
        # iyzico birkaç dk sessizlikten sonra ilk bağlantıyı düşürüyor; dakikada bir küçük istekle sıcak tutulur. 0 = kapalı.
        IYZIPAY_KEEP_WARM_MS: ${IYZIPAY_KEEP_WARM_MS:-60000}
        # İzleme: izler ve ölçümler Grafana'ya (lgtm) gider.
        OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
        OTEL_SERVICE_NAME: iyzico-service
        OTEL_LOGS_EXPORTER: none
        OTEL_METRIC_EXPORT_INTERVAL: "15000"
      ports:
        # Yalnızca bu bilgisayardan erişilir (yerel geliştirme, Swagger UI).
        - "127.0.0.1:8081:8081"
      depends_on:
        postgres:
          condition: service_healthy
        rabbitmq:
          condition: service_healthy
      healthcheck:
        test: [ "CMD-SHELL", "wget -qO- http://localhost:8081/health || exit 1" ]
        interval: 5s
        timeout: 5s
        retries: 20

    backend:
      build:
        context: .
        dockerfile: Dockerfile
      environment:
        SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/eticaret
        # Yalnızca public şemasına yetkili kullanıcı
        SPRING_DATASOURCE_USERNAME: backend_app
        SPRING_DATASOURCE_PASSWORD: ${BACKEND_DB_PASSWORD:-backend_dev_password}
        JWT_SECRET: ${JWT_SECRET:?JWT_SECRET .env dosyasinda tanimli olmali}
        IYZICO_SERVICE_URL: http://iyzico-service:8081
        RABBITMQ_HOST: rabbitmq
        # İzleme: izler ve ölçümler Grafana'ya (lgtm) gider.
        OTEL_ENABLED: "true"
        OTEL_TRACES_ENDPOINT: http://lgtm:4318/v1/traces
        OTEL_METRICS_ENDPOINT: http://lgtm:4318/v1/metrics
        RABBITMQ_USER: ${RABBITMQ_USER:-eticaret}
        RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-eticaret_dev_rabbit}
        INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN .env dosyasinda tanimli olmali}
        APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:3000}
      ports:
        - "8080:8080"
      depends_on:
        postgres:
          condition: service_healthy
        iyzico-service:
          condition: service_healthy
        rabbitmq:
          condition: service_healthy

    frontend:
      build:
        context: ./admin-panel
        dockerfile: Dockerfile
      ports:
        - "3000:80"
      depends_on:
        - backend

    # Grafana + Tempo (izler) + Prometheus (ölçümler) + Loki tek konteynerde. Yalnızca yerel geliştirme için.
    # Grafana: http://localhost:3001 (giriş gerekmez). Servisler OTLP ile 4318'e gönderir.
    lgtm:
      image: grafana/otel-lgtm:0.38.1
      environment:
        GF_AUTH_ANONYMOUS_ENABLED: "true"
        GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
        GF_AUTH_DISABLE_LOGIN_FORM: "true"
        # Sayaç yeni açıldığında (servis yeniden başlayınca) başlangıç anına sıfır yazılır; yoksa düşük
        # trafikte ilk istek grafikte kaybolur (artış "başlangıç değeri" sanılır).
        PROMETHEUS_EXTRA_ARGS: --enable-feature=created-timestamp-zero-ingestion
      ports:
        - "127.0.0.1:3001:3000"
      volumes:
        - lgtm_data:/data
        - ./docker/grafana/dashboards:/otel-lgtm/dashboards/e-ticaret:ro
        - ./docker/grafana/provisioning/e-ticaret-dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/e-ticaret.yaml:ro

  volumes:
    postgres_data:
    rabbitmq_data:
    pgadmin_data:
    lgtm_data: