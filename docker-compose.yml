  services:
    postgres:
      image: postgres:17-alpine
      environment:
        POSTGRES_DB: eticaret
        POSTGRES_USER: eticaret_user
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eticaret_dev_password}
      ports:
        - "5432:5432"
      volumes:
        - postgres_data:/var/lib/postgresql/data
      healthcheck:
        test: [ "CMD-SHELL", "pg_isready -U eticaret_user -d eticaret" ]
        interval: 5s
        timeout: 5s
        retries: 10

    backend:
      build:
        context: .
        dockerfile: Dockerfile
      environment:
        SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/eticaret
        SPRING_DATASOURCE_USERNAME: eticaret_user
        SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-eticaret_dev_password}
        JWT_SECRET: ${JWT_SECRET:-404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
      ports:
        - "8080:8080"
      depends_on:
        postgres:
          condition: service_healthy

    frontend:
      build:
        context: ./admin-panel
        dockerfile: Dockerfile
      ports:
        - "3000:80"
      depends_on:
        - backend

  volumes:
    postgres_data: