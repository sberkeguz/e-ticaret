  services:
    postgres:
      image: postgres:17-alpine
      environment:
        POSTGRES_DB: eticaret
        POSTGRES_USER: eticaret_user
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eticaret_dev_password}
        # Servis kullanıcılarının şifreleri (yalnızca ilk kurulumda kullanılır)
        BACKEND_DB_PASSWORD: ${BACKEND_DB_PASSWORD:-backend_dev_password}
        IYZICO_DB_PASSWORD: ${IYZICO_DB_PASSWORD:-iyzico_dev_password}
        CARGO_DB_PASSWORD: ${CARGO_DB_PASSWORD:-cargo_dev_password}
      ports:
        - "5432:5432"
      volumes:
        - postgres_data:/var/lib/postgresql/data
        # Boş veritabanı ilk açıldığında servis kullanıcılarını kurar (backend_app, iyzico_app, cargo_app)
        - ./docker/postgres/init/10-service-roles.sh:/docker-entrypoint-initdb.d/10-service-roles.sh:ro
        - ./docker/postgres/service-roles.sql:/docker-entrypoint-initdb.d/service-roles.sql.txt:ro
      healthcheck:
        test: [ "CMD-SHELL", "pg_isready -U eticaret_user -d eticaret" ]
        interval: 5s
        timeout: 5s
        retries: 10

    # Veritabanı yönetim paneli: http://localhost:5050 (yalnızca bu bilgisayardan, giriş gerekmez)
    # Masaüstü modu: tek kullanıcı, giriş ekranı yok. Port yalnız 127.0.0.1'e açık olduğu için güvenli.
    pgadmin:
      image: dpage/pgadmin4:9
      environment:
        PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
        PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin_dev_password}
        PGADMIN_CONFIG_SERVER_MODE: "False"
        PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
        # Veritabanı bağlantısı her açılışta hazır gelir; şifre .env'den gelen pgpass ile verilir.
        PGADMIN_REPLACE_SERVERS_ON_STARTUP: "True"
      ports:
        - "127.0.0.1:5050:80"
      volumes:
        - pgadmin_data:/var/lib/pgadmin
        - ./docker/pgadmin/servers.json:/pgadmin4/servers.json:ro
      configs:
        - source: pgadmin_pgpass
          target: /pgadmin4/pgpass
          uid: "5050"
          mode: 0600
      depends_on:
        postgres:
          condition: service_healthy

    # Servisler arası mesajlaşma. Yönetim arayüzü: http://localhost:15672 (DLQ'lar burada görünür)
    rabbitmq:
      image: rabbitmq:4-management-alpine
      environment:
        RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-eticaret}
        RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-eticaret_dev_rabbit}
      ports:
        - "127.0.0.1:5672:5672"
        - "127.0.0.1:15672:15672"
      volumes:
        - rabbitmq_data:/var/lib/rabbitmq
      configs:
        # http://localhost:15672/autologin.html → giriş yapılmış panel (başlatma kısayolu bunu açar).
        # Yol eklenti sürümüne bağlı: RabbitMQ sürümü değişirse burayı güncelleyin.
        - source: rabbitmq_autologin_page
          target: /opt/rabbitmq/plugins/rabbitmq_management-4.4.0/priv/www/autologin.html
        - source: rabbitmq_autologin_script
          target: /opt/rabbitmq/plugins/rabbitmq_management-4.4.0/priv/www/js/autologin.js
      healthcheck:
        test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
        interval: 5s
        timeout: 10s
        retries: 20

    # iyzico ile konuşan tek servis (NestJS + Prisma). Aynı Postgres, kendi şeması (iyzico).
    iyzico-service:
      build:
        context: ./services/iyzico-service
        dockerfile: Dockerfile
      environment:
        # Yalnızca iyzico şemasına yetkili kullanıcı
        DATABASE_URL: postgresql://iyzico_app:${IYZICO_DB_PASSWORD:-iyzico_dev_password}@postgres:5432/eticaret?schema=iyzico
        RABBITMQ_URL: amqp://${RABBITMQ_USER:-eticaret}:${RABBITMQ_PASSWORD:-eticaret_dev_rabbit}@rabbitmq:5672
        INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN .env dosyasinda tanimli olmali}
        IYZIPAY_API_KEY: ${IYZIPAY_API_KEY:-}
        IYZIPAY_SECRET_KEY: ${IYZIPAY_SECRET_KEY:-}
        IYZIPAY_BASE_URL: ${IYZIPAY_BASE_URL:-https://sandbox-api.iyzipay.com}
        # 3D dönüşü tarayıcıdan backend'e gelir (ngrok), backend bu servise iletir.
        IYZIPAY_CALLBACK_URL: ${IYZIPAY_CALLBACK_URL:-http://localhost:8080/api/payments/callback}
        # iyzico birkaç dk sessizlikten sonra ilk bağlantıyı düşürüyor; dakikada bir küçük istekle sıcak tutulur. 0 = kapalı.
        IYZIPAY_KEEP_WARM_MS: ${IYZIPAY_KEEP_WARM_MS:-60000}
        # İzleme: izler ve ölçümler Grafana'ya (lgtm) gider.
        OTEL_EXPORTER_OTLP_ENDPOINT: http://lgtm:4318
        OTEL_SERVICE_NAME: iyzico-service
        OTEL_LOGS_EXPORTER: otlp
        # Konsol logu JSON; her satır OpenTelemetry ile Grafana'ya (Loki) da gider.
        LOG_FORMAT: json
        OTEL_METRIC_EXPORT_INTERVAL: "15000"
      ports:
        # Yalnızca bu bilgisayardan erişilir (yerel geliştirme, Swagger UI).
        - "127.0.0.1:8081:8081"
      depends_on:
        postgres:
          condition: service_healthy
        rabbitmq:
          condition: service_healthy
      healthcheck:
        test: [ "CMD-SHELL", "wget -qO- http://localhost:8081/health || exit 1" ]
        interval: 5s
        timeout: 5s
        retries: 20

    # Kargo servisi (.NET 10). Aynı Postgres, kendi şeması (cargo). Backend ile yalnızca RabbitMQ
    # üzerinden konuşur (komut: cargo.shipment-requests, olaylar: cargo exchange'i).
    cargo-service:
      build:
        context: ./services/cargo-service
        dockerfile: Dockerfile
      environment:
        # Yalnızca cargo şemasına yetkili kullanıcı. Verilmezse servis açılmaz.
        # GSS Encryption Mode=Disable: alpine imajında Kerberos kütüphanesi yok; Npgsql her bağlantıda
        # denemesin ve loga "libgssapi_krb5.so.2" hatası düşmesin.
        ConnectionStrings__Cargo: Host=postgres;Port=5432;Database=eticaret;Username=cargo_app;Password=${CARGO_DB_PASSWORD:-cargo_dev_password};GSS Encryption Mode=Disable
        RabbitMq__Url: amqp://${RABBITMQ_USER:-eticaret}:${RABBITMQ_PASSWORD:-eticaret_dev_rabbit}@rabbitmq:5672
        # Zorunlu, varsayılanı yok. Şu an yalnızca sahte kargo firması (Fake) var.
        Carrier__Provider: Fake
        # Yerel geliştirme: sahte firmanın test uçları (/test/fake-carrier/...) X-Internal-Token ile açılır.
        # Gerçek firma ya da canlı ortamda "false" olmalı.
        Carrier__Fake__TestEndpointsEnabled: "true"
        InternalApiToken: ${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN .env dosyasinda tanimli olmali}
      ports:
        # Yalnızca bu bilgisayardan erişilir (yerel geliştirme, sahte firma test uçları).
        - "127.0.0.1:8082:8082"
      depends_on:
        postgres:
          condition: service_healthy
        rabbitmq:
          condition: service_healthy
      healthcheck:
        # ready: veritabanına bağlanabiliyorsa 200 (RabbitMQ durumu etkilemez).
        test: [ "CMD-SHELL", "wget -qO- http://localhost:8082/health/ready || exit 1" ]
        interval: 5s
        timeout: 5s
        retries: 20
        start_period: 15s

    backend:
      build:
        context: .
        dockerfile: Dockerfile
      environment:
        SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/eticaret
        # Yalnızca public şemasına yetkili kullanıcı
        SPRING_DATASOURCE_USERNAME: backend_app
        SPRING_DATASOURCE_PASSWORD: ${BACKEND_DB_PASSWORD:-backend_dev_password}
        JWT_SECRET: ${JWT_SECRET:?JWT_SECRET .env dosyasinda tanimli olmali}
        IYZICO_SERVICE_URL: http://iyzico-service:8081
        RABBITMQ_HOST: rabbitmq
        # İzleme: izler ve ölçümler Grafana'ya (lgtm) gider.
        OTEL_ENABLED: "true"
        OTEL_TRACES_ENDPOINT: http://lgtm:4318/v1/traces
        OTEL_METRICS_ENDPOINT: http://lgtm:4318/v1/metrics
        OTEL_LOGS_ENDPOINT: http://lgtm:4318/v1/logs
        # Konsol logu JSON (Elastic Common Schema): makinenin okuyacağı, izleme numarası içeren biçim.
        SPRING_PROFILES_ACTIVE: json-logs
        LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
        RABBITMQ_USER: ${RABBITMQ_USER:-eticaret}
        RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-eticaret_dev_rabbit}
        INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN .env dosyasinda tanimli olmali}
        APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:3000}
      ports:
        - "8080:8080"
      depends_on:
        postgres:
          condition: service_healthy
        iyzico-service:
          condition: service_healthy
        rabbitmq:
          condition: service_healthy
      healthcheck:
        test: [ "CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1" ]
        interval: 5s
        timeout: 5s
        retries: 30
        start_period: 20s

    frontend:
      build:
        context: ./admin-panel
        dockerfile: Dockerfile
      ports:
        - "3000:8080"
      depends_on:
        backend:
          condition: service_healthy

    # Grafana + Tempo (izler) + Prometheus (ölçümler) + Loki tek konteynerde. Yalnızca yerel geliştirme için.
    # Grafana: http://localhost:3001 (giriş gerekmez). Servisler OTLP ile 4318'e gönderir.
    lgtm:
      image: grafana/otel-lgtm:0.38.1
      environment:
        GF_AUTH_ANONYMOUS_ENABLED: "true"
        GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
        GF_AUTH_DISABLE_LOGIN_FORM: "true"
        # Sayaç yeni açıldığında (servis yeniden başlayınca) başlangıç anına sıfır yazılır; yoksa düşük
        # trafikte ilk istek grafikte kaybolur (artış "başlangıç değeri" sanılır).
        PROMETHEUS_EXTRA_ARGS: --enable-feature=created-timestamp-zero-ingestion
      ports:
        - "127.0.0.1:3001:3000"
      volumes:
        - lgtm_data:/data
        - ./docker/grafana/dashboards:/otel-lgtm/dashboards/e-ticaret:ro
        - ./docker/grafana/provisioning/e-ticaret-dashboards.yaml:/otel-lgtm/grafana/conf/provisioning/dashboards/e-ticaret.yaml:ro
        - ./docker/grafana/provisioning/e-ticaret-alerts.yaml:/otel-lgtm/grafana/conf/provisioning/alerting/e-ticaret.yaml:ro

    # Kod kalitesi: SonarQube Community Build (ücretsiz). http://localhost:9000 (kullanıcı: admin).
    # Yaklaşık 2 GB bellek ister; bu yüzden normal "up" ile açılmaz. Tarama: .\sonar.ps1
    # (sunucuyu açar, ilk kurulumu yapar, backend + arayüz + iyzico-service'i tarar).
    sonarqube:
      image: sonarqube:community
      profiles: [ sonar ]
      environment:
        SONAR_JDBC_URL: jdbc:postgresql://sonar-db:5432/sonar
        SONAR_JDBC_USERNAME: sonar
        SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD:-sonar_dev_password}
        # Docker Desktop'ta vm.max_map_count ayarı gerekmesin (gömülü Elasticsearch mmap kullanmaz).
        SONAR_SEARCH_JAVAADDITIONALOPTS: -Dnode.store.allow_mmap=false
      ports:
        - "127.0.0.1:9000:9000"
      volumes:
        - sonarqube_data:/opt/sonarqube/data
        - sonarqube_extensions:/opt/sonarqube/extensions
      depends_on:
        sonar-db:
          condition: service_healthy

    # SonarQube'un kendi veritabanı: uygulamanın veritabanından ayrı tutulur.
    sonar-db:
      image: postgres:17-alpine
      profiles: [ sonar ]
      environment:
        POSTGRES_DB: sonar
        POSTGRES_USER: sonar
        POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:-sonar_dev_password}
      volumes:
        - sonar_db_data:/var/lib/postgresql/data
      healthcheck:
        test: [ "CMD-SHELL", "pg_isready -U sonar -d sonar" ]
        interval: 5s
        timeout: 5s
        retries: 10

    # Tarayıcılar: yalnızca sonar.ps1 çalıştırır ("docker compose run"), iş bitince kapanır.
    # Backend derlenmiş sınıflarla taranır (Java kuralları bunları ister); testler çalıştırılmaz.
    sonar-scan-backend:
      image: maven:3.9-eclipse-temurin-21
      profiles: [ sonar-scan ]
      working_dir: /src
      environment:
        SONAR_TOKEN: ${SONAR_TOKEN:-}
      command: >
        mvn -B -q -DskipTests compile org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
        -Dsonar.host.url=http://sonarqube:9000
        -Dsonar.projectKey=e-ticaret-backend -Dsonar.projectName=e-ticaret-backend
      volumes:
        - .:/src
        - sonar_maven_cache:/root/.m2

    sonar-scan-frontend:
      image: sonarsource/sonar-scanner-cli
      profiles: [ sonar-scan ]
      environment:
        SONAR_HOST_URL: http://sonarqube:9000
        SONAR_TOKEN: ${SONAR_TOKEN:-}
      volumes:
        - ./admin-panel:/usr/src
        - sonar_scanner_cache:/opt/sonar-scanner/.sonar/cache

    sonar-scan-iyzico:
      image: sonarsource/sonar-scanner-cli
      profiles: [ sonar-scan ]
      environment:
        SONAR_HOST_URL: http://sonarqube:9000
        SONAR_TOKEN: ${SONAR_TOKEN:-}
      volumes:
        - ./services/iyzico-service:/usr/src
        - sonar_scanner_cache:/opt/sonar-scanner/.sonar/cache

  configs:
    # RabbitMQ paneline şifre girmeden giriş (yalnız yerel geliştirme; panel 127.0.0.1'e açık).
    # Panelin kendi giriş isteğini yapar, sonucu panelin sakladığı yere yazar ve panele geçer.
    # Panelin güvenlik politikası sayfa içi script'e izin vermez; script ayrı dosyada.
    rabbitmq_autologin_page:
      content: |
        <!doctype html><meta charset="utf-8"><title>RabbitMQ giriş</title><p>Giriş yapılıyor…</p>
        <script src="js/autologin.js"></script>
    rabbitmq_autologin_script:
      content: |
        var body = new URLSearchParams({username: "${RABBITMQ_USER:-eticaret}", password: "${RABBITMQ_PASSWORD:-eticaret_dev_rabbit}"});
        fetch("api/login", {method: "POST", body: body}).then(function (r) { return r.json(); }).then(function (res) {
          if (!res.token) throw new Error(res.reason || "giriş başarısız");
          localStorage.removeItem("rabbitmq.session_expiry");
          localStorage.setItem("rabbitmq.credentials", res.token.value);
          localStorage.setItem("rabbitmq.auth-scheme", res.token.type === "bearer" ? "Bearer" : "Basic");
          location.replace("./#/");
        }).catch(function (e) { document.body.textContent = "RabbitMQ girişi başarısız: " + e.message; });
    # pgAdmin'in veritabanına şifre sormadan bağlanması için (şifre .env'den; dosya diske yazılmaz)
    pgadmin_pgpass:
      content: "postgres:5432:*:eticaret_user:${POSTGRES_PASSWORD:-eticaret_dev_password}"

  volumes:
    postgres_data:
    rabbitmq_data:
    pgadmin_data:
    lgtm_data:
    sonarqube_data:
    sonarqube_extensions:
    sonar_db_data:
    sonar_maven_cache:
    sonar_scanner_cache:
