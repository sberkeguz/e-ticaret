server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker'ın iç DNS'i. Backend konteyneri yeniden kurulunca IP'si değişir; adres değişkenle
    # verildiği için nginx onu açılışta bir kez değil, 10 sn'de bir yeniden çözer (yoksa 502 verir).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_upstream http://backend:8080;

    location /api/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Derlenen dosyaların adında içerik özeti var (index-AbC123.js): değişmezler, uzun süre önbelleklenebilir.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html her seferinde sunucuya sorulur: yeni sürüm yayınlanınca kullanıcı hemen yeni kodu alır.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}