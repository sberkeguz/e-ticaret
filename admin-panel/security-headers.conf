# Uygulama sayfaları için güvenlik başlıkları (nginx.conf'taki her konumda include edilir; nginx,
# bir konumda add_header varsa üst seviyedekileri miras almaz).
#
# CSP: yalnızca kendi kodumuz çalışır; dışarıya yalnızca il/ilçe adres API'sine istek atılır.
# Bir XSS açığı olsa bile saldırganın betiği yüklenemez, veri başka adrese gönderilemez.
# - img-src https: ürün görselleri herhangi bir https adresinden olabilir
# - frame-src https: 3D Secure çerçevesi bankanın ve dönüş sayfasının (ngrok) adresine gider
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https://api.turkiyeapi.dev; frame-src 'self' https:; form-action 'self'; frame-ancestors 'self'; base-uri 'self'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header X-Frame-Options "SAMEORIGIN" always;
